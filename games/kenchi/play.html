<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>けんっち</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a2140;--shell:#ff8fb8;--shell2:#ffc2d9;--lcd:#cfe8b9;--lcd2:#b7d69c;--g:#5fbf4a;--g2:#2e7a26}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#fdf0f6;color:var(--ink);font-family:"M PLUS Rounded 1c",sans-serif;min-height:100vh}
.wrap{max-width:430px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:"DotGothic16",monospace;font-size:28px;letter-spacing:2px}
.logo small{font-size:12px;display:block;letter-spacing:0;font-family:"M PLUS Rounded 1c";font-weight:800;opacity:.7}
.zbtn{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-family:inherit;cursor:pointer}
.device{margin:10px auto 0;background:radial-gradient(circle at 30% 25%,var(--shell2),var(--shell) 60%);border:4px solid var(--ink);
 border-radius:48% 48% 44% 44%/42% 42% 56% 56%;padding:34px 26px 26px;box-shadow:0 8px 0 var(--ink)}
.lcd{background:var(--lcd);border:4px solid var(--ink);border-radius:18px;padding:8px;position:relative;
 box-shadow:inset 0 0 0 4px var(--lcd2)}
.lcdtop{display:flex;justify-content:space-between;font-family:"DotGothic16",monospace;font-size:14px;padding:0 4px}
svg#pet{width:100%;display:block;aspect-ratio:1}
.bubble{margin-top:4px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;
 font-family:"DotGothic16",monospace;font-size:15px;min-height:34px;transition:opacity .3s}
.stats{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;margin-top:14px;font-weight:800;font-size:13px}
.bar{height:14px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.bar i.low{background:#ff5a5a}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.b{border:3px solid var(--ink);background:#fff;border-radius:16px;padding:8px 2px;font-family:inherit;font-weight:800;font-size:12px;
 cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.b span{display:block;font-size:26px}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.b:disabled{opacity:.35}
.overlay{position:fixed;inset:0;background:rgba(42,33,64,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.panel{background:#fff;border:4px solid var(--ink);border-radius:22px;padding:18px;max-width:380px;width:100%;text-align:center;
 box-shadow:0 8px 0 var(--ink);max-height:88vh;overflow:auto}
.panel h2{font-family:"DotGothic16",monospace;font-size:26px;margin:4px 0 8px}
.panel p{margin:8px 0;font-weight:800;line-height:1.6}
.big{font-size:64px;line-height:1.1}
.pbtn{display:block;width:100%;margin-top:10px;border:3px solid var(--ink);background:var(--shell);color:#fff;font-weight:800;font-size:17px;
 font-family:inherit;padding:12px;border-radius:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;-webkit-text-stroke:.5px var(--ink)}
.pbtn.w{background:#fff;color:var(--ink);-webkit-text-stroke:0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.choices .pbtn{margin:0;font-size:16px}
.zukan{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px}
.zukan div{border:2px solid var(--ink);border-radius:8px;font-size:10px;padding:3px 0;font-weight:800;background:#eee;color:#aaa}
.zukan div.got{background:#fff3c4;color:var(--ink)}
.zukan div b{display:block;font-size:18px}
.hidden{display:none}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{font-size:11px;opacity:.6;text-align:center;margin-top:16px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.mini{position:relative;border:3px solid var(--ink);background:var(--lcd);border-radius:12px;padding:3px;cursor:pointer;font-family:inherit}
.mini.sel{background:#fff7a8;box-shadow:0 0 0 3px var(--shell)}
.mini.empty{opacity:.35;font-weight:800}
.mini svg{width:100%;aspect-ratio:1;display:block}
.mb{height:5px;border:1.5px solid var(--ink);border-radius:3px;background:#fff;margin-top:2px;overflow:hidden}
.mb i{display:block;height:100%;background:var(--g)}.mb i.low{background:#ff5a5a}
.alert{position:absolute;top:-8px;right:-4px;font-size:18px;animation:blink .5s infinite alternate}
@keyframes blink{to{opacity:.2}}
.runinfo{font-size:12px;font-weight:800;text-align:center;margin-top:6px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;
 font-weight:800;font-size:14px;z-index:30;transition:transform .25s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.b:disabled{opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">けんっち<small>都道府県育成ゲーム</small></div>
    <button class="zbtn" id="zukanBtn">📖 図鑑 <span id="zcount">0</span>/47</button>
  </div>
  <div id="minis" class="minis hidden"></div><div id="runinfo" class="runinfo hidden"></div>
  <div class="device" id="device">
    <div class="lcd">
      <div class="lcdtop"><span id="stage">たまご</span><span id="age">0さい</span></div>
      <svg id="pet" viewBox="-130 -130 260 260"></svg>
      <div class="bubble" id="bubble">……</div>
    </div>
  </div>
  <div class="stats">
    <div>🍙 おなか</div><div class="bar"><i id="hBar"></i></div>
    <div>😊 ごきげん</div><div class="bar"><i id="mBar"></i></div>
    <div>✨ そだち</div><div class="bar"><i id="gBar" style="background:#ffb400"></i></div>
  </div>
  <div class="btns">
    <button class="b" id="feedBtn"><span>🍙</span>ごはん</button>
    <button class="b" id="playBtn"><span>🎾</span>あそぶ</button>
    <button class="b" id="cleanBtn"><span>🧹</span>そうじ</button>
    <button class="b" id="guessBtn"><span>🔍</span>なに県？</button>
  </div>
  <div class="note">ほっとくと すぐ廃県になります。／デビエゴ</div>
</div>

<div class="toast" id="toast"></div>
<div class="overlay" id="ov"><div class="panel" id="panel"></div></div>

  const sad=P.h<30||P.m<30,blink=Math.floor((t+P.age*999)/150)%25===0;
  if(P.alive===true||P.alive==="done"){
    const eye=blink?`<rect x="-18" y="-6" width="10" height="3" fill="#222"/><rect x="8" y="-6" width="10" height="3" fill="#222"/>`
      :`<circle cx="-13" cy="-5" r="5" fill="#222"/><circle cx="13" cy="-5" r="5" fill="#222"/><circle cx="-11" cy="-7" r="1.6" fill="#fff"/><circle cx="15" cy="-7" r="1.6" fill="#fff"/>`;
    const mouth=sad?`<path d="M-7 12 Q0 5 7 12" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`
      :`<path d="M-7 7 Q0 15 7 7" stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    s+=`<g transform="translate(${fx},${fy}) scale(${fs})">${eye}<ellipse cx="-22" cy="5" rx="5" ry="3" fill="#ff8fb8" opacity=".7"/><ellipse cx="22" cy="5" rx="5" ry="3" fill="#ff8fb8" opacity=".7"/>${mouth}${sad?'<text x="20" y="-14" font-size="16">💦</text>':''}</g>`;
  }else s+=`<g transform="translate(${fx},${fy}) scale(${fs})"><text x="0" y="6" font-size="22" text-anchor="middle">✕ ✕</text></g>`;
  P.poops.forEach(p=>s+=`<text x="${p[0]}" y="${p[1]}" font-size="${mini?40:22}" text-anchor="middle">💩</text>`);
  if(!mini&&P.anim&&t<P.anim.until)s+=`<text x="0" y="${-60-(P.anim.until-t)/40}" font-size="34" text-anchor="middle">${P.anim.e}</text>`;
  if(dead)s+=`<text x="0" y="-100" font-size="${mini?60:26}" text-anchor="middle">👼</text>`;
  if(P.alive==="done")s+=`<text x="0" y="-95" font-size="${mini?60:30}" text-anchor="middle">🎁</text>`;
  return s;
}
function stageName(P){const g=P.g;return g<.12?"たまご":g<.35?"ちびけん":g<.6?"こどもけん":g<.85?"わかけん":"おとなけん"}
function renderMinis(){
  const box=$("minis");box.innerHTML="";
  for(let i=0;i<MAXP;i++){
    const d=document.createElement("button");d.className="mini"+(i===sel?" sel":"")+(pets[i]?"":" empty");
    d.innerHTML=pets[i]?`<svg viewBox="-130 -130 260 260"></svg><div class="mb"><i></i></div><div class="mb"><i></i></div><b class="alert"></b>`:"<span>…</span>";
    if(pets[i])d.onclick=()=>{sel=i;renderMinis()};box.appendChild(d);
  }
}
function ui(t){
  const P=cur();if(!P)return;
  const set=(id,v)=>{const e=$(id);e.style.width=Math.max(0,v)+"%";e.classList.toggle("low",id!=="gBar"&&v<30)};
  set("hBar",P.h);set("mBar",P.m);set("gBar",P.g*100);
  $("stage").textContent=(mode==="multi"?`${sel+1}号 `:"")+stageName(P);$("age").textContent=Math.floor(P.age/10)+"さい";
  $("bubble").textContent=P.msg;
  const ok=P.alive===true;["feedBtn","playBtn","cleanBtn"].forEach(id=>$(id).disabled=!ok);
  $("guessBtn").disabled=P.guessed||P.g<.2||!ok;
  $("pet").innerHTML=petSVG(P,t,false);
  if(mode==="multi"&&run){
    const tiles=$("minis").children;
    pets.forEach((Q,i)=>{const el=tiles[i];if(!el||!el.firstChild)return;
      el.querySelector("svg").innerHTML=petSVG(Q,t,true);
      const bars=el.querySelectorAll(".mb i");bars[0].style.width=Math.max(0,Q.h)+"%";bars[1].style.width=Math.max(0,Q.m)+"%";
      bars[0].classList.toggle("low",Q.h<30);bars[1].classList.toggle("low",Q.m<30);
      el.querySelector(".alert").textContent=Q.alive===true&&(Q.h<30||Q.m<30||Q.poops.length>=3)?"❗":"";
    });
    $("runinfo").textContent=`育てた ${run.grown}県　廃県 ${"🪦".repeat(run.dead)}${"・".repeat(3-run.dead)}　つぎのたまご ${pets.length<MAXP?Math.ceil(run.spawn)+"秒":"満員"}`;
  }
}
function say(P,t){P.msg=t}
function chatter(P){
  if(P.h<25)return say(P,pick(["おなか…すいた…","ごはん…","ひもじい…"]));
  if(P.m<25)return say(P,pick(["かまって…","ひま…","さみしい…"]));
  if(P.poops.length>=2)return say(P,"くさい…そうじして…");
  if(P.g<.12)return say(P,pick(["……（ゆれている）","……（ぴくっ）","……"]));
  if(P.g>.55&&Math.random()<.6)return say(P,pick(DIALECT[INFO[P.pref.n][2]]));
  if(P.g>.5&&P.pref.l.length&&Math.random()<.3)return say(P,"なんか…みずうみができそう");
  say(P,pick(GENERIC));
}
function stepPet(P,dt){
  if(P.alive!==true){P.gone-=dt;return}
  P.age+=dt;P.h-=dt*2.1;P.m-=dt*(1.6+P.poops.length*.7);
  P.g=Math.min(1,P.g+dt/(P.h>35&&P.m>35?110:300));
  P.nextPoop-=dt;
  if(P.nextPoop<=0&&P.g>.08){P.poops.push([-90+Math.random()*180,85+Math.random()*25]);P.nextPoop=10+Math.random()*8;say(P,"……（うんちした）")}
  P.talk-=dt;if(P.talk<=0){chatter(P);P.talk=4+Math.random()*3}
  if(P.h<=0)die(P,"おなかがすきすぎて");else if(P.m<=0)die(P,"さみしすぎて");
  else if(P.poops.length>=5)die(P,"不衛生すぎて");else if(P.g>=1)grown(P);
}
function tick(now){
  const dt=Math.min(.25,(now-lastT)/1000);lastT=now;
  if(run&&$("ov").classList.contains("hidden")){
    run.time+=dt;pets.forEach(P=>stepPet(P,dt));
    if(mode==="multi"){
      // clear finished slots
      let changed=false;
      for(let i=pets.length-1;i>=0;i--)if(pets[i].alive!==true&&pets[i].gone<=0){pets.splice(i,1);changed=true;if(sel>=i&&sel>0)sel--}
      if(run.dead>=3)return gameOver(),requestAnimationFrame(tick);
      if(pets.length<MAXP){run.spawn-=dt;if(run.spawn<=0||pets.length===0){pets.push(makePet());run.spawn=SPAWN;changed=true;toast("🥚 たまごが ふえた！")}}
      if(changed)renderMinis();
    }
  }
  ui(now);requestAnimationFrame(tick);
}
function pop(P,e){P.anim={e,until:performance.now()+900}}
$("feedBtn").onclick=()=>{const P=cur();if(P.alive!==true)return;
  if(P.h>92){P.m-=12;say(P,"もう…はいらない…");$("device").classList.add("shake");setTimeout(()=>$("device").classList.remove("shake"),400);return}
  P.h=Math.min(100,P.h+32);pop(P,P.g>.5?INFO[P.pref.n][0]:"🍙");say(P,pick(["もぐもぐ","うまっ","おいしい！"]))};
$("playBtn").onclick=()=>{const P=cur();if(P.alive!==true)return;P.m=Math.min(100,P.m+28);P.h-=7;pop(P,pick(["🎾","⭐","🎵"]));say(P,pick(["きゃっきゃ","たのしい！","もっと！"]))};
$("cleanBtn").onclick=()=>{const P=cur();if(P.alive!==true)return;if(!P.poops.length){say(P,"きれいだよ？");return}
  P.poops=[];P.m=Math.min(100,P.m+5);pop(P,"✨");say(P,"すっきり！")};
$("guessBtn").onclick=()=>{const P=cur();
  const opts=[P.pref.n];while(opts.length<4){const s=pick(SHAPES).n;if(!opts.includes(s))opts.push(s)}
  opts.sort(()=>Math.random()-.5);
  openOv(`<h2>なに県だと思う？</h2><p>当たったら特産品 <b>2倍</b>。<br>はずすと すねます。（1回だけ）</p>
   <div class="choices">${opts.map(o=>`<button class="pbtn w" data-o="${o}">${o}</button>`).join("")}</div>
   <button class="pbtn" onclick="closeOv()">まだ わからん</button>`);
  document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
    P.guessed=true;closeOv();
    if(b.dataset.o===P.pref.n){P.bonus=true;P.m=Math.min(100,P.m+20);pop(P,"💮");say(P,"なんでわかったん！？")}
    else{P.m-=25;pop(P,"💢");say(P,`${b.dataset.o}じゃないし…`)}});
};
function grown(P){
  const [e,name]=INFO[P.pref.n];const n=P.bonus?2:1;
  zukan[P.pref.n]=(zukan[P.pref.n]||0)+n;saveZ();updZ();P.g=1;P.alive="done";P.gone=3;run.grown++;
  P.msg=`りっぱな${P.pref.n}になった！ ${name}をあげる！`;
  if(mode==="multi")return toast(`🎉 ${P.pref.n}が育った！ ${e}${n>1?"×2":""}`);
  openOv(`<h2>🎉 りっぱな${P.pref.n}になった！</h2><div class="big">${e}${P.bonus?e:""}</div>
   <p>おれいに <b>${name}</b> を${n>1?"2こ":""}もらった！</p><p style="font-size:12px;opacity:.7">${Math.floor(P.age)}秒でそだちきった</p>
   <button class="pbtn" onclick="startGame('single')">つぎのたまご</button><button class="pbtn w" onclick="menu()">モードえらび</button>`);
}
function die(P,why){
  P.alive=false;P.g=Math.max(P.g,.35);P.gone=3;run.dead++;P.msg=`${why}旅立った…（正体は${P.pref.n}）`;
  if(mode==="multi")return toast(`🪦 ${why}${P.pref.n}が廃県…`);
  openOv(`<h2>廃県しました…</h2><div class="big">🪦</div><p>${why}、${stageName(P)}は旅立った。</p>
   <p>正体は <b>${P.pref.n}</b> でした。</p><button class="pbtn" onclick="startGame('single')">あたらしいたまご</button>
   <button class="pbtn w" onclick="closeOv()">おはかを見る</button><button class="pbtn w" onclick="menu()">モードえらび</button>`);
}
function gameOver(){
  const r=run.grown;const title=r>=10?"日本列島の母":r>=6?"地方自治の神":r>=3?"県知事":r>=1?"村長":"廃県職人";
  openOv(`<h2>3県 廃県で終了…</h2><div class="big">🗾</div><p>${Math.floor(run.time)}秒で <b>${r}県</b> 育てた</p>
   <p>称号：<b>${title}</b></p><a class="pbtn" style="text-decoration:none;display:block" target="_blank" rel="noopener"
   href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`『けんっち』多県モードで${r}県育てて3県廃県にした。\n称号：${title}\n#けんっち #デビエゴ`)}">Xでつぶやく</a>
   <button class="pbtn" onclick="startGame('multi')">もう一回</button><button class="pbtn w" onclick="menu()">モードえらび</button>`);
  run=null;
}
let toastT;function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),1800)}
function openOv(h){$("panel").innerHTML=h;$("ov").classList.remove("hidden")}
function closeOv(){$("ov").classList.add("hidden");lastT=performance.now()}
function updZ(){$("zcount").textContent=Object.keys(zukan).length}
$("zukanBtn").onclick=()=>{
  openOv(`<h2>📖 けんっち図鑑</h2><p>${Object.keys(zukan).length}/47 そだてた</p><div class="zukan">${SHAPES.map(s=>{const g=zukan[s.n];
   return `<div class="${g?"got":""}"><b>${g?INFO[s.n][0]:"？"}</b>${g?s.n.replace(/[県府都]$/,""):"？？"}</div>`}).join("")}</div>
   <button class="pbtn" onclick="${run?"closeOv()":"menu()"}">とじる</button>`)};
document.addEventListener("visibilitychange",()=>{lastT=performance.now()});
function menu(){run=null;openOv(`<h2>けんっち</h2><div class="big">🥚</div><p>みどりのまるいやつを育てると、<br>だんだん都道府県になります。</p>
 <p style="font-size:13px">ほっとくとすぐ廃県。りっぱに育てば特産品をくれる。<br>途中で🔍当てると2倍！</p>
 <button class="pbtn" onclick="startGame('single')">🥚 1県モード</button>
 <button class="pbtn" style="background:#ff5a5a" onclick="startGame('multi')">🥚🥚🥚🥚 多県モード（地獄）</button>
 <p style="font-size:12px;opacity:.7">多県モード：${SPAWN}秒ごとにたまごが増える（最大4県）。<br>3県廃県したら終わり。</p>`)}
updZ();pets=[makePet()];menu();
requestAnimationFrame(t=>{lastT=t;tick(t)});
</script>
</body>
</html>
